{% extends "base.html" %}
{% block titulo %}Acceso | Sistema POS{% endblock %}
{% block contenido %}
<div class="card login">
  <h1>🧾 Sistema POS</h1>
  <p class="muted">Ingresa tus credenciales para continuar</p>

  <form method="post">
    <label for="usuario">Usuario</label>
    <input type="text" id="usuario" name="usuario" required autofocus>

    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" required>

    <button type="submit" class="btn">Ingresar</button>
  </form>

  <details class="demo">
    <summary>Usuarios de prueba</summary>
    <ul>
      <li><b>admin</b> / admin123</li>
      <li><b>supervisor</b> / super123</li>
      <li><b>cajero</b> / caja123</li>
    </ul>
  </details>
</div>
{% endblock %}
